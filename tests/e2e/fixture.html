<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fixture</title>
<style>
  body { font-family: Arial, sans-serif; margin: 40px; background: #fafafa; }
  .card { display: flex; gap: 12px; align-items: center; padding: 16px 24px; border: 1px solid #ddd;
          border-radius: 8px; background: #fff; color: #333; width: 420px; }
  .card::before { content: "\2605"; color: gold; }
  .card h2 { margin: 0; font-size: 20px; }
  :root { --brand: #0969da; }
  .card:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); }
  @media (max-width: 600px) { .card { width: auto; } }
  .btn { padding: 8px 14px; border-radius: 6px; background: var(--brand); color: #fff; border: 0; }
  .scroller { height: 80px; overflow: auto; border: 1px dashed #999; margin-top: 20px; width: 300px; }
</style>
</head>
<body>
  <a href="/navigated" id="link">
    <div class="card md:flex" x-data="{ open: false }">
      <img src="img/logo.png" alt="" width="32" height="32">
      <h2>Product title</h2>
      <button class="btn" onclick="window.pageClicked = true">Buy</button>
    </div>
  </a>
  <button id="outside" onclick="window.pageClicked = true">Outside</button>
  <div class="scroller"><div style="height:400px">tall content</div></div>
  <script>window.pageClicked = false; document.addEventListener('click', () => { window.pageClicked = true; }, true);</script>
  <script>
    // Simulated framework internals, shaped like what React and jQuery store on elements.
    function ProductCard() {}
    function App() {}
    document.querySelector('.btn')['__reactProps$test'] = {
      onClick: function handleBuy(e) { console.log('buy'); },
      children: 'Buy',
    };
    document.querySelector('.card')['__reactFiber$test'] = {
      type: 'div',
      return: { type: ProductCard, return: { type: App, return: null } },
    };
    window.jQuery = {
      fn: { jquery: '3.7.1' },
      _data(el, key) {
        if (el === document && key === 'events') {
          return { click: [{ selector: '.card', handler: function onCardClick() { return 1; } }] };
        }
        return undefined;
      },
    };
  </script>
</body>
</html>
